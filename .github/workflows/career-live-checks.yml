name: Live career package checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: career-live-verification
  cancel-in-progress: true
jobs:
  verify-live:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser verification tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1 axe-core@4.11.0
          npx playwright install --with-deps chromium
      - name: Wait for the deployed commit
        run: node scripts/wait-for-live.cjs
      - name: Verify the live career package
        run: node scripts/check-site.cjs --live
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-career-package-verification
          path: qa-output
          retention-days: 14
