name: Career package checks
on:
  push:
    branches: [career-package-recovery-20261008]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm recoverable source
        run: |
          test -s scripts/resume.json
          test -s scripts/build-resume.cjs
          test -s downloads/Eric_John_Cruz_Resume.docx
          git rev-parse HEAD
