<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<rect width="1200" height="760" rx="30" fill="#edf5f8"/>
<rect x="56" y="50" width="1088" height="660" rx="28" fill="#fff"/>
<text x="88" y="108" font-family="Arial,sans-serif" font-size="32" font-weight="800" fill="#12304a">Email Campaign Performance Review</text>
<text x="88" y="143" font-family="Arial,sans-serif" font-size="16" fill="#5f6b7a">Sanitized structure based on recurring newsletter + follow-up reporting</text>
<g font-family="Arial,sans-serif">
<rect x="88" y="184" width="460" height="212" rx="18" fill="#f7faf9" stroke="#dbe2e6"/>
<text x="114" y="222" font-size="18" font-weight="700" fill="#12304a">Campaign comparison</text>
<text x="114" y="260" font-size="14" fill="#53616b">Metric</text><text x="334" y="260" font-size="14" font-weight="700" fill="#2d7a67">Newsletter</text><text x="434" y="260" font-size="14" font-weight="700" fill="#386f8f">Follow-up</text>
<line x1="114" y1="275" x2="516" y2="275" stroke="#dbe2e6"/>
<text x="114" y="308" font-size="14" fill="#53616b">Delivered</text><text x="334" y="308" font-size="14" fill="#12304a">Reviewed</text><text x="434" y="308" font-size="14" fill="#12304a">Reviewed</text>
<text x="114" y="340" font-size="14" fill="#53616b">Open rate</text><text x="334" y="340" font-size="14" fill="#12304a">Compared</text><text x="434" y="340" font-size="14" fill="#12304a">Compared</text>
<text x="114" y="372" font-size="14" fill="#53616b">Click rate</text><text x="334" y="372" font-size="14" fill="#12304a">Compared</text><text x="434" y="372" font-size="14" fill="#12304a">Compared</text>
<rect x="588" y="184" width="524" height="212" rx="18" fill="#12304a"/>
<text x="616" y="224" font-size="18" font-weight="700" fill="#fff">What the report answers</text>
<text x="616" y="263" font-size="15" fill="#d4e3ea">• Which send earned stronger measurable attention?</text>
<text x="616" y="297" font-size="15" fill="#d4e3ea">• Did click engagement improve or decline?</text>
<text x="616" y="331" font-size="15" fill="#d4e3ea">• Were there unsubscribe / deliverability concerns?</text>
<text x="616" y="365" font-size="15" fill="#d4e3ea">• Which engaged contacts merit follow-up?</text>
<rect x="88" y="430" width="1024" height="220" rx="18" fill="#f7f2e8"/>
<text x="116" y="470" font-size="18" font-weight="700" fill="#12304a">From metrics to action</text>
<text x="116" y="510" font-size="15" fill="#53616b">1. Compare the newsletter and follow-up rather than reading one send in isolation.</text>
<text x="116" y="544" font-size="15" fill="#53616b">2. Identify meaningful engagement signals and list-health changes.</text>
<text x="116" y="578" font-size="15" fill="#53616b">3. Prioritize timely follow-up with engaged accounts or contacts.</text>
<text x="116" y="612" font-size="15" fill="#53616b">4. Send a concise performance summary with a clear recommendation.</text>
</g></svg>